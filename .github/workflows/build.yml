name: Build portable EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm "Simple File Converter.spec"
      - name: Verify portable build
        run: python scripts/verify_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Simple-File-Converter-Windows-x64
          path: |
            dist/Simple File Converter.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
