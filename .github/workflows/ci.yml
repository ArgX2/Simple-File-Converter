name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Conversion diagnostics
        shell: pwsh
        run: |
          python src/app.py --self-test build/diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content build/diagnostics/report.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Conversion diagnostics failed.' }
